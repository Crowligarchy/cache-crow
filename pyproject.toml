[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cache-crow"
version = "0.1.0"
description = "Scan and extract media from Electron app caches (Discord, etc.)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["discord", "cache", "forensics", "cli", "electron", "media", "recovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0",
    "watchdog>=4.0",
]

[project.optional-dependencies]
leveldb = ["plyvel>=1.5"]
tui = ["textual>=1.0"]
dev = ["pytest", "ruff", "build", "twine"]

[project.urls]
Homepage = "https://github.com/Crowligarchy/cache-crow"
Repository = "https://github.com/Crowligarchy/cache-crow"
"Bug Tracker" = "https://github.com/Crowligarchy/cache-crow/issues"

[project.scripts]
cache-crow = "cache_crow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cache_crow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live Discord API tests (require DISCORD_TOKEN_B and DISCORD_TEST_CHANNEL_ID)",
]
# Run full suite including integration: source ~/.crowligarchy/credentials.env && export DISCORD_TOKEN_B DISCORD_TEST_CHANNEL_ID && python -m pytest

[tool.ruff]
line-length = 100
target-version = "py310"
