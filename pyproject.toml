[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cache-crow"
version = "0.1.0"
description = "Scan and extract media from Electron app caches (Discord, etc.)"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "watchdog>=4.0",
    "textual>=0.60",
    "plyvel>=1.5",
]

[project.scripts]
cache-crow = "cache_crow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cache_crow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live Discord API tests (require DISCORD_TOKEN_B and DISCORD_TEST_CHANNEL_ID)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
